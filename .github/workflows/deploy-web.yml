name: Deploy Web Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build & Validate Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Compile Full-Stack Production Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/server.cjs || (echo "dist/server.cjs not found!" && exit 1)
          test -f dist/index.html || (echo "dist/index.html not found!" && exit 1)
          echo "Production artifacts verified successfully."

      - name: Upload Production Dist
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-web-dist
          path: dist/
          retention-days: 14
