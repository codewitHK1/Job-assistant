name: Deploy Web Application

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Allows backward compatibility for any action runner dependencies
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build_and_test:
    name: Build & Validate Web App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # Only enable npm cache if package-lock.json is present
          cache: ${{ hashFiles('package-lock.json') != '' && 'npm' || '' }}

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            echo "package-lock.json detected. Running clean install (npm ci)..."
            npm ci
          else
            echo "No package-lock.json found. Running npm install and creating lockfile..."
            npm install
          fi

      - name: Run Type Check & Lint
        run: npm run lint

      - name: Compile Full-Stack Production Bundle
        run: npm run build

      - name: Verify Build Artifacts
        run: |
          test -f dist/server.cjs || (echo "dist/server.cjs not found!" && exit 1)
          test -f dist/index.html || (echo "dist/index.html not found!" && exit 1)
          echo "Production artifacts verified successfully."

      - name: Upload Production Dist
        uses: actions/upload-artifact@v4
        with:
          name: jobpilot-web-dist
          path: dist/
          retention-days: 14
