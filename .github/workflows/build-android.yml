name: Build Android APK

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Variant'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      create_release:
        description: 'Publish as GitHub Release'
        required: true
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  build:
    name: Build Android APK (${{ inputs.build_type || 'debug' }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      # Android SDK is pre-installed on GitHub Actions runners (/usr/local/lib/android/sdk).
      # Replacing android-actions/setup-android@v3 prevents the fatal 'Failed to find package tools' error.
      - name: Configure Android SDK & Accept Licenses
        run: |
          echo "=== Configuring Android SDK & Accepting Licenses ==="
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

          # Pre-accept all Android SDK licenses directly
          mkdir -p "$ANDROID_HOME/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$ANDROID_HOME/licenses/intel-android-extra-license"
          printf "\ne9acab5b5f15c81849d547794381ed56762995db" > "$ANDROID_HOME/licenses/google-gdk-license"
          printf "\n601085b94cd77f0b54ff86406957099fed7926c4" > "$ANDROID_HOME/licenses/android-googletv-license"
          printf "\n33b6a2b64607f11b759f320ef9dff4ae5c47d97a" > "$ANDROID_HOME/licenses/mips-android-sysimage-license"

          # Also run sdkmanager --licenses non-interactively if present
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
          fi
          echo "Android SDK configured and licenses verified."

      # Using Gradle 8.7 for guaranteed Android Gradle Plugin 8.x compatibility
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Prepare Secrets, Environment & Keystores
        run: |
          echo "=== Step: Preparing Secrets & Keystore ==="

          # 1. Ensure .env file exists
          if [ ! -f .env ]; then
            if [ -f .env.example ]; then
              echo "Creating .env from .env.example..."
              cp .env.example .env
            else
              echo "Creating empty .env..."
              touch .env
            fi
          fi

          # 2. Standardize Android user directory for keystores
          mkdir -p ~/.android

          # 3. Decode base64 debug keystore if present in repo or secrets
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "Decoding debug keystore from GitHub Secret..."
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 --decode > ~/.android/debug.keystore
            cp ~/.android/debug.keystore ./debug.keystore
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug keystore from file..."
            base64 -d debug.keystore.base64 > ~/.android/debug.keystore 2>/dev/null || base64 --decode debug.keystore.base64 > ~/.android/debug.keystore 2>/dev/null || true
            cp ~/.android/debug.keystore ./debug.keystore
          fi

          # 4. Generate a valid, repeatable debug keystore if still missing
          if [ ! -f ~/.android/debug.keystore ] || [ ! -s ~/.android/debug.keystore ]; then
            echo "Generating fresh Android debug keystore..."
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=JobPilot Debug,O=JobPilot AI,C=US"
            cp ~/.android/debug.keystore ./debug.keystore
          fi

          echo "Keystore verified successfully at ~/.android/debug.keystore and ./debug.keystore"

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            echo "Generating standard Gradle wrapper..."
            gradle wrapper --gradle-version 8.7 --distribution-type bin
          fi
          chmod +x gradlew

      - name: Build APK with Gradle
        id: gradle_build
        run: |
          BUILD_VARIANT="${{ inputs.build_type || 'debug' }}"
          echo "Building variant: $BUILD_VARIANT"

          if [ -f gradlew ]; then
            GRADLE_CMD="./gradlew"
          else
            GRADLE_CMD="gradle"
          fi

          if [ "$BUILD_VARIANT" = "release" ]; then
            $GRADLE_CMD assembleRelease --stacktrace --no-daemon
          else
            $GRADLE_CMD assembleDebug --stacktrace --no-daemon
          fi

      - name: Locate and Package Compiled APK
        id: find_apk
        run: |
          echo "=== Searching for compiled APK outputs ==="
          APK_PATH=$(find . -type f -name "*.apk" ! -name "*unaligned*" | head -n 1)

          if [ -z "$APK_PATH" ]; then
            # Fallback search if unaligned check filtered everything
            APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: No compiled APK was found!"
            find . -type d -name "apk" -exec ls -la {} +
            exit 1
          fi

          echo "Found APK: $APK_PATH"
          FILE_SIZE=$(stat -c%s "$APK_PATH" 2>/dev/null || stat -f%z "$APK_PATH" 2>/dev/null || echo "unknown")
          echo "File size: $FILE_SIZE bytes"

          # Create descriptive release filename
          RUN_NUM="${{ github.run_number }}"
          BUILD_TYPE="${{ inputs.build_type || 'debug' }}"
          DEST_NAME="JobPilot-AI-${BUILD_TYPE}-v1.0.${RUN_NUM}.apk"
          cp "$APK_PATH" "./${DEST_NAME}"

          # Generate SHA256 checksum
          sha256sum "./${DEST_NAME}" > "./${DEST_NAME}.sha256"
          cat "./${DEST_NAME}.sha256"

          echo "apk_path=./${DEST_NAME}" >> $GITHUB_OUTPUT
          echo "checksum_path=./${DEST_NAME}.sha256" >> $GITHUB_OUTPUT
          echo "filename=${DEST_NAME}" >> $GITHUB_OUTPUT

      - name: Create Public GitHub Release
        if: |
          (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_release == true)
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ github.ref_type == 'tag' && format('JobPilot AI Release {0}', github.ref_name) || format('JobPilot AI v1.0.{0}', github.run_number) }}
          body: |
            ## JobPilot AI Android APK Release

            - **Build Variant**: `${{ inputs.build_type || 'debug' }}`
            - **Commit**: `${{ github.sha }}`
            - **Branch/Ref**: `${{ github.ref_name }}`
            - **File**: `${{ steps.find_apk.outputs.filename }}`

            ### Verification Checksum (SHA-256)
            ```text
            $(cat ${{ steps.find_apk.outputs.checksum_path }})
            ```

            *Automated CI build powered by GitHub Actions.*
          draft: false
          prerelease: ${{ inputs.build_type == 'debug' }}
          files: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.checksum_path }}

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find_apk.outputs.filename }}
          path: |
            ${{ steps.find_apk.outputs.apk_path }}
            ${{ steps.find_apk.outputs.checksum_path }}
          if-no-files-found: error
          retention-days: 30
